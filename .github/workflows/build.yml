name: Build All

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Cache Buildroot downloads
      uses: actions/cache@v4
      with:
        path: sysdrv/source/buildroot/buildroot-2023.02.6/dl
        key: buildroot-dl-${{ hashFiles('sysdrv/source/buildroot/buildroot-2023.02.6/configs/luckfox_*') }}
        restore-keys: |
          buildroot-dl-

    - name: Cache Buildroot output
      uses: actions/cache@v4
      with:
        path: sysdrv/source/buildroot/buildroot-2023.02.6/output
        key: buildroot-out-${{ hashFiles('project/cfg/**/BoardConfig-*.mk', 'sysdrv/source/buildroot/buildroot-2023.02.6/configs/luckfox_*', 'sysdrv/Makefile') }}
        restore-keys: |
          buildroot-out-

    - name: Cache Kernel build objects
      uses: actions/cache@v4
      with:
        path: |
          sysdrv/source/objs_kernel
          sysdrv/source/kernel/out
        key: kernel-${{ hashFiles('project/cfg/**/BoardConfig-*.mk', 'sysdrv/source/kernel/arch/arm/configs/luckfox_*', 'sysdrv/Makefile') }}
        restore-keys: |
          kernel-

    - name: Run build script
      run: sh build_all.sh

    - name: Fix permissions for cache save
      if: always()
      run: |
        sudo chown -R "$USER":"$USER" \
          sysdrv/source/buildroot/buildroot-2023.02.6/dl \
          sysdrv/source/buildroot/buildroot-2023.02.6/output \
          sysdrv/source/objs_kernel \
          sysdrv/source/kernel/out 2>/dev/null || true

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        name: ${{ github.ref_name }}
        tag_name: ${{ github.ref_name }}
        files: output/image/*
        fail_on_unmatched_files: true
